<!doctype html><html><head><meta charset="utf-8"></head><body><audio id="crusher" src="crusher.wav" preload="auto"></audio><audio id="warning" src="warning.wav" preload="auto"></audio><script>
const audio=document.getElementById('crusher'),warning=document.getElementById('warning');audio.volume=0;warning.volume=0;
window.addEventListener('message',({data:d})=>{if(d.action==='start'){audio.currentTime=Math.min(21.9,Math.max(0,d.elapsed||0));audio.play().catch(()=>{});}if(d.action==='warning'&&(d.elapsed||0)<3){warning.currentTime=Math.max(0,d.elapsed||0);warning.play().catch(()=>{});}if(d.action==='stop'){audio.pause();audio.currentTime=0;warning.pause();warning.currentTime=0;}if(d.action==='volume'){audio.volume=Math.max(0,Math.min(1,d.volume));warning.volume=audio.volume;}});
</script></body></html>
